<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pretty Puress | Luxury Press-On Nails</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#800080">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pretty Puress Admin">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
html {
  scroll-behavior: smooth;
}
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #fff;
  color: #111;
}
.navbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  background: rgba(246,185,244,0.97);
  padding: 14px 25px;
  display: flex;
  gap: 25px;
  z-index: 9999;
  box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}
.navbar a {
  text-decoration: none;
  color: #7a007a;
  font-weight: bold;
}
.navbar a:hover {
  color: #3b003b;
}
.hero {
  background: linear-gradient(135deg, #f7cbf6, #eca7ea);
  padding: 140px 20px 90px;
  text-align: center;
}
.hero h1 {
  font-size: 3rem;
  margin-bottom: 16px;
  color: #111;
  letter-spacing: 6px;
  animation: fadeSlide 1.2s ease forwards;
}
.hero-subtitle {
  font-size: 1.2rem;
  color: #3b003b;
  margin-bottom: 40px;
  animation: fadeSlide 1.6s ease forwards;
}
.hero-buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}
.button {
  display: inline-block;
  background: #111;
  color: white;
  padding: 14px 26px;
  border-radius: 6px;
  text-decoration: none;
}
.button.secondary {
  background: transparent;
  border: 2px solid #111;
  color: #111;
}
@keyframes fadeSlide {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);

  </script>

</body>
</html>
